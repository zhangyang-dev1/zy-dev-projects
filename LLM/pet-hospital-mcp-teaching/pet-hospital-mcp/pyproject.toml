[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "无状态 Streamable HTTP MCP 服务：把 Go 宠物医院 REST API 暴露给 AI Agent（MCP Python SDK 2.x / 协议 2026-07-28）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # 官方 MCP Python SDK 2.x（高层服务器为 MCPServer，协议版本 2026-07-28）
    "mcp==2.0.0",
    # 调用 Go REST 后端的 HTTP 客户端
    "httpx>=0.28,<1",
    # 输入 / 输出 / 错误模型
    "pydantic>=2.12,<3",
    # mcp 2.0.0 间接依赖，自定义 /health 路由直接使用，显式声明
    "starlette>=0.48",
    # mcp.run(transport="streamable-http") 的 ASGI 主机
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_hospital_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
